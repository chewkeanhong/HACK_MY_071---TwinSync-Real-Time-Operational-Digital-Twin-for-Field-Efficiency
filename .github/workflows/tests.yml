# The suite is the claim that the numbers in the README are reproducible, so it runs on
# every push. Only requirements.txt is installed: the tests exercise the runtime, and
# requirements-dev.txt pulls rasterio/GDAL, which is needed to *bake* the DEM and the
# Sentinel-2 scene but not to read the committed artifacts.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the suite
        run: pytest tests/ -q

      # The A/B comparison is the pitch's central claim, and it is only a controlled
      # experiment if the same seed gives the same answer. Two runs, diffed.
      - name: Check the headless run is deterministic
        run: |
          python -m twinsync.sim --seed 42 --quiet --json /tmp/a.json
          python -m twinsync.sim --seed 42 --quiet --json /tmp/b.json
          diff /tmp/a.json /tmp/b.json && echo "deterministic"
